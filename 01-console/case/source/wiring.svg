<rect x="550" y="736" width="980" height="250" rx="14" fill="#26282d" stroke="#3a3d44"/>
<text x="574" y="780" class="n">VCC and LED both go to 3V3 (Y-splice). Use 3.3 V only, never 5 V on the GPIOs.</text>
<text x="574" y="820" class="n">MISO is not connected. Wire everything with the board unplugged.</text>
<text x="574" y="860" class="n">Inside the case the ESP32 is mounted upside down, pins facing up,</text>
<text x="574" y="900" class="n">so the left row in this drawing ends up on the right. Go by the pin labels.</text>
<text x="574" y="940" class="n">The antenna-end corners (3V3 and GND) use locating pegs, no screws.</text>
<text x="60" y="1165" class="s">Component side view, antenna at the top. Used pins are colored.</text>
